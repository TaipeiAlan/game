<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", sans-serif;
    color: #f5f5f7;
    background: radial-gradient(circle at 20% 20%, #1f2a4a 0%, #0b1020 60%, #05070f 100%);
    min-height: 100vh;
  }
  header {
    padding: 64px 24px 32px;
    text-align: center;
  }
  header h1 {
    font-size: clamp(2rem, 5vw, 3.25rem);
    letter-spacing: 0.04em;
    background: linear-gradient(90deg, #7df9ff, #b388ff, #ff80ab);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    margin-top: 12px;
    color: #aab3d1;
    font-size: 1rem;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 24px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(179, 136, 255, 0.6);
    background: rgba(255, 255, 255, 0.08);
  }
  .thumb {
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: 12px;
    margin-bottom: 16px;
    display: grid;
    place-items: center;
    background:
      conic-gradient(from 45deg at 50% 50%,
        #ef4444 0 25%, #22c55e 25% 50%,
        #3b82f6 50% 75%, #fbbf24 75% 100%);
    position: relative;
  }
  .thumb-tetris {
    background:
      linear-gradient(135deg, #7df9ff 0%, #b388ff 50%, #ff80ab 100%);
  }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 18%;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(2px);
  }
  .thumb span {
    position: relative;
    z-index: 1;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .card h2 {
    font-size: 1.25rem;
    margin-bottom: 6px;
  }
  .card p {
    color: #aab3d1;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .tag {
    display: inline-block;
    margin-top: 14px;
    padding: 4px 10px;
    font-size: 0.75rem;
    border-radius: 999px;
    background: rgba(179, 136, 255, 0.2);
    color: #d3c2ff;
    border: 1px solid rgba(179, 136, 255, 0.35);
    align-self: flex-start;
  }
  footer {
    text-align: center;
    padding: 32px 16px 48px;
    color: #6b7390;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Game Hub</h1>
    <p>挑選一款遊戲開始遊玩</p>
  </header>
  <main>
    <div class="grid">
      <a class="card" href="magic-cube/index.html">
        <div class="thumb"><span>3×3×3</span></div>
        <h2>魔術方塊</h2>
        <p>經典的 3D 魔術方塊。打亂後試著把六面還原。</p>
        <span class="tag">Puzzle · 3D</span>
      </a>
      <a class="card" href="tetris/index.html">
        <div class="thumb thumb-tetris"><span>TETRIS</span></div>
        <h2>俄羅斯方塊</h2>
        <p>經典的俄羅斯方塊。支援鍵盤與螢幕按鈕操作。</p>
        <span class="tag">Arcade · 2D</span>
      </a>
    </div>
  </main>
  <footer>© Game Hub</footer>
</body>
</html>
